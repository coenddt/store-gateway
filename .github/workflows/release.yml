name: release

# 发布 store-gateway-node(npm)与 store-gateway-py(PyPI)。
#
# 触发:推 v* tag(版本必须与 node/package.json、py/pyproject.toml 一致),或手动 dispatch(仅校验)。
# 凭证:
#   - npm:NPM_TOKEN secret(仓库 Settings → Secrets → Actions;只此一处,禁入仓库/文档)
#   - PyPI:PYPI_API_TOKEN secret(user=__token__)——用户裁决(2026-10-04)皮肤层包走 API token 路线,
#     以免去 pypi.org 网页 Trusted Publisher 配置(全项目其余发布流均用 OIDC,此处为例外,已留痕)。
# 形态对齐 store-graphql/.github/workflows/release.yml(皮肤层发布唯一先例)。
# 发布顺序:本仓最后发布(依赖 store-api-node / store-grpc-node / store-graphql-node 已在 npm 上)。
# 首发前提:双远端(gitee 事实源 + github 镜像)已建、仓库 secrets 已配、tag 由 gitee 打并 sync。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm publish (store-gateway-node)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance(OIDC)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json version $PKG 不一致" >&2
            exit 1
          fi
      - name: Install & test
        run: npm install --no-fund --no-audit && npm test
      - name: Pack & inspect
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: PyPI publish (store-gateway-py)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('py/pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME 与 pyproject version $PKG 不一致" >&2
            exit 1
          fi
      - name: Build
        run: pip install build && python -m build --outdir py/dist py
      - name: Twine check
        run: pip install twine && twine check py/dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false # 无 OIDC(id-token),不做 PEP 740 证明
