[project]
name = "store-gateway-py"
version = "0.1.1"
description = "Optional combiner for the three py-store API skins (REST store-api-py / GraphQL store-graphql-py / gRPC store-grpc-py): config-driven per-skin enable switches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["py-store", "storepy", "gateway", "rest", "graphql", "grpc", "pluggable"]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
rest = ["store-api-py"]
graphql = ["store-graphql-py"]
grpc = ["store-grpc-py"]
# 皮肤包（store-api-py / store-graphql-py / store-grpc-py）本地开发时以
# `pip install -e` 各自仓库路径安装（发布 PyPI 前不进 dev extras）
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
